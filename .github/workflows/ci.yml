# Проверка на каждый push и pull request: модульные тесты и статическая проверка Android Lint.
# Сборка идёт на серверах GitHub — телефон и локальная машина не нужны.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # В репозитории gradlew хранится без права на запуск (его добавляли с Windows)
      - run: chmod +x gradlew

      - name: Модульные тесты (общий модуль и приложение)
        run: ./gradlew :shared:test :app:testDebugUnitTest --stacktrace

      - name: Android Lint (новые замечания сверх lint-baseline.xml)
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Отчёты при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests
            shared/build/reports/tests
            app/build/reports/lint-results-debug.html
